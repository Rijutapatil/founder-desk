[project]
name = "founder-desk"
version = "0.1.0"
description = "Grounded answers to first-year compliance questions for new Indian companies. Every claim quotes a primary government source, or the system refuses."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rijuta Patil" }]

# Core stays deliberately small. Everything that is *measured* - the allowlist,
# retrieval, the eval and the CI gate - runs on these alone, with no API key and
# no network. Heavier capabilities live in extras so the gate is never expensive
# enough to be worth disabling.
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "tenacity>=8.3",
    "structlog>=24.1",
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Fetching and parsing the official sources.
ingest = [
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pypdf>=4.2",
]
# Cross-encoder reranking. torch is ~2 GB, so it is opt-in: the base install and
# the default CI job run without it, and the eval reports retrieval quality both
# with and without so the reranker has to earn its latency.
rerank = [
    "sentence-transformers>=3.0",
]
serving = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "types-PyYAML",
]

[project.scripts]
founder-desk = "serving.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "ingest", "eval", "serving", "sources"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ANN", "RUF"]
ignore = [
    "ANN401", # allow Any where genuinely needed
    "E501",   # line length is the formatter's job
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "bs4.*", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
