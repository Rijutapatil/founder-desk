  # ----------------------------- NSWS APPROVAL PAGES: MEASURED AND EXCLUDED
  #
  # The nine entries below were collected, indexed, and then removed on the
  # evidence. They are the full Ministry of Corporate Affairs and Ministry of
  # Labour approval catalogues on NSWS (found with `python -m
  # ingest.discover_nsws`), and adding them made the system materially worse:
  #
  #                        overall   refused   recall@1
  #     without            0.878     0.654     0.727
  #     with all nine      0.793     0.423     0.705
  #
  # The cause is what these pages are. Each is a one-paragraph description of
  # what an approval *is* - not when it is due, what it costs, or how many
  # directors it needs. That makes them topically close to a wide class of
  # company questions the corpus still cannot answer, so the relevance gate lets
  # them through and a refusal becomes a confidently-cited wrong answer:
  # "what is the minimum paid up capital for a private limited company" came
  # back with the text of the INC-20A declaration.
  #
  # Excluding only the five marginal ones changed nothing (0.793 / 0.423), so
  # the harm is not in the edge cases - it is in the shallow-but-on-topic shape
  # they all share. Shallow coverage of a domain is worse than none, because it
  # converts honest refusals into plausible errors.
  #
  # They stay listed so this is a recorded result rather than a deleted branch.
  # Re-including them needs either deeper sources for the same topics, or a gate
  # that can tell "about this subject" from "answers this question".

  # ------------------------------------------- INCORPORATION (rendered)
  # NSWS builds its pages in the browser: a plain GET returns 29 characters of
  # shell. These need the optional [browser] extra. They are the only route
  # found to official incorporation content - MCA itself refuses automated
  # clients and is not spoofed.
  - id: nsws-incorporation
    publisher: National Single Window System (DPIIT) - Ministry of Corporate Affairs
    title: Incorporation of a Company - approval details
    url: https://www.nsws.gov.in/portal/approval-details/ministry-of-corporate-affairs/ministry-of-corporate-affairs/incorporation-of-a-company
    authority_tier: 3
    domains: [incorporation]
    license: "NSWS portal content - Government of India; terms not yet read in full"
    license_verified: false
    refresh_days: 90
    render: true
    content_selector: .marketplace-content
    notes: >-
      Names the entity types (Private / Public / Government / Section 8 /
      One-Person / Producer / IFSC / Foreign), the governing Companies Act 2013
      and Companies Incorporation Rules 2014, and the stated processing time.

