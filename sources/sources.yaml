# The allowlist. Nothing outside this file can enter the index.
#
# Every entry must be published on an official government host (see
# OFFICIAL_HOST_SUFFIXES in loader.py) and must declare a licence and a refresh
# window. The loader raises on anything else, so "official sources only" is a
# property of the code rather than a promise in a README.
#
# `fetch_status: blocked` records sources that are in scope but return 403 to
# automated clients. They stay listed on purpose - deleting them would make the
# corpus look complete when a whole domain is under-covered.
#
# Status of every URL below was checked against the live sites on 2026-09-04.

sources:
  # ---------------------------------------------------------------- GST
