  - id: esic-acts
    publisher: Employees' State Insurance Corporation (ESIC)
    title: ESI Acts, Rules and Regulations
    url: https://esic.gov.in/esi-acts
    authority_tier: 1
    domains: [labour]
    license: "ESIC website content - Government of India; terms not yet read in full"
    license_verified: false
    refresh_days: 365
    fetch_status: blocked
    notes: >-
      TLS failure, not a 403: esic.gov.in serves an incomplete certificate chain
      ("unable to get local issuer certificate", checked 2026-09-04). Disabling
      certificate verification would collect it, and is refused deliberately -
      turning off TLS validation to ingest legal text is precisely the wrong
      trade, since a tampered response would be indistinguishable from a real
      one. Blocked until the chain is fixed upstream or an intermediate bundle
      is pinned explicitly.

