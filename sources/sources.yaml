    license: "NSWS portal content - Government of India; terms not yet read in full"
    license_verified: false
    refresh_days: 90
    fetch_status: blocked
    notes: >-
      The index of every central approval. Renders, but it is a paginated,
      filtered React listing whose links load a ministry at a time, so
      collecting the whole catalogue means driving the UI rather than fetching a
      page. The three approval pages that matter for a first year are listed
      individually above instead. Its internal JSON API
      (/gateway-sec/form-builder-sec/marketplace/license-detail) returns HTTP 400
      to a plain request - undocumented and not reverse-engineered, since the
      rendered page is the interface the portal actually offers the public.
