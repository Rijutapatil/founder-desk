    ca_bundle: globalsign-gcc-r6-alphassl-ca-2025.pem
    notes: >-
      esic.gov.in serves only its leaf certificate and omits the intermediate,
      so the chain cannot be built from a normal trust store ("unable to get
      local issuer certificate"). Rather than disable verification, the missing
      GlobalSign intermediate is committed under sources/certs/ and supplied
      explicitly; validation still terminates at GlobalSign Root CA - R6, which
      is already in certifi. Verified 2026-09-04: return code 0. The pinned
      certificate expires 2027-05-21 and a test fails once it is within 90 days
      of that.

